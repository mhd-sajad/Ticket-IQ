services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ticketiq-backend
    ports:
      - "8000:7860"
    environment:
      - PORT=7860
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7860/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:8000"
        VITE_USE_MOCK: "false"
    container_name: ticketiq-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
